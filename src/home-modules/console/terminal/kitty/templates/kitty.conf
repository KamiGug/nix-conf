font_family {{ font }}
font_size 11

enable_audio_bell no
visual_bell_duration 0.12

kitty_mod {{ kittyMod }}

shell_integration no-rc

map {{ kittyMod }}+' launch --cwd=current
map {{ kittyMod }}+t launch --type=tab --cwd=current
map {{ kittyMod }}+z toggle_layout stack
map {{ kittyMod }}+e detach_window ask
map {{ kittyMod }}+r detach_tab ask

map {{ kittyMod }}+left neighboring_window left
map {{ kittyMod }}+right neighboring_window right
map {{ kittyMod }}+up neighboring_window up
map {{ kittyMod }}+down neighboring_window down

map {{ kittyMod }}+alt+left resize_window narrower 1
map {{ kittyMod }}+alt+right resize_window wider 1
map {{ kittyMod }}+alt+up resize_window taller 1
map {{ kittyMod }}+alt+down resize_window shorter 1

map {{ kittyMod }}+[ previous_tab
map {{ kittyMod }}+] next_tab
map {{ kittyMod }}+space next_layout
map {{ kittyMod }}+f5 load_config_file
