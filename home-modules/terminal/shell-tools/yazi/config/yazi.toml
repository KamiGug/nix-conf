[manager]
show_hidden = true
sort_by = "natural"
sort_dir_first = true
linemode = "size"

[preview]
wrap = "yes"
tab_size = 2

[opener]
edit = [
    { run = 'if test -n "$KAKOUNE_SESSION"; then kak -c "$KAKOUNE_SESSION" %s; else kak %s; fi', block = true, for = "unix" },
]

open = [
    { run = 'xdg-open %s1', orphan = true, for = "unix" },
]

[open]
rules = [
    { name = "*/", use = [ "edit", "open" ] },
    { mime = "text/*", use = [ "edit", "open" ] },
    { mime = "application/json", use = [ "edit", "open" ] },
    { mime = "application/x-yaml", use = [ "edit", "open" ] },
    { mime = "application/toml", use = [ "edit", "open" ] },
    { name = "*", use = [ "open" ] },
]
