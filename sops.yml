keys:
  # Master/admin key. Keep the private key off the hosts.
  - &master age1dmawdc96sk8yent9u9wvmwzxk6ean4zpkq6n7msx952ppnnxj90q5utu5u

  # Host keys
  - &kg-continabook age1REPLACE_WITH_KG_CONTINABOOK_PUBLIC_KEY
  - &kkbook age1REPLACE_WITH_KKBOOK_PUBLIC_KEY
  - &kknas age1REPLACE_WITH_KKNAS_PUBLIC_KEY
  - &kkphone age1REPLACE_WITH_KKPHONE_PUBLIC_KEY
  - &kkserv age1REPLACE_WITH_KKSERV_PUBLIC_KEY
  - &kktab age1REPLACE_WITH_KKTAB_PUBLIC_KEY
  - &kkworker age1REPLACE_WITH_KKWORKER_PUBLIC_KEY

creation_rules:
  # ============================================================
  # HOST SECRETS
  # ============================================================

  # kg-continabook
  - path_regex: secrets/hosts/kg-continabook\.ya?ml$
    key_groups:
      - age:
          - *master
          - *kg-continabook

  # kkbook
  - path_regex: secrets/hosts/kkbook\.ya?ml$
    key_groups:
      - age:
          - *master
          - *kkbook

  # kknas
  - path_regex: secrets/hosts/kknas\.ya?ml$
    key_groups:
      - age:
          - *master
          - *kknas

  # kkphone
  - path_regex: secrets/hosts/kkphone\.ya?ml$
    key_groups:
      - age:
          - *master
          - *kkphone

  # kkserv
  - path_regex: secrets/hosts/kkserv\.ya?ml$
    key_groups:
      - age:
          - *master
          - *kkserv

  # kktab
  - path_regex: secrets/hosts/kktab\.ya?ml$
    key_groups:
      - age:
          - *master
          - *kktab

  # kkworker
  - path_regex: secrets/hosts/kkworker\.ya?ml$
    key_groups:
      - age:
          - *master
          - *kkworker


  # ============================================================
  # USER SECRETS
  # ============================================================

  # peon is present on kkbook and kktab.
  - path_regex: secrets/users/peon\.ya?ml$
    key_groups:
      - age:
          - *master
          - *kkbook
          - *kktab

  # wisp is present on kkphone, kknas, kkworker and kkserv.
  - path_regex: secrets/users/wisp\.ya?ml$
    key_groups:
      - age:
          - *master
          - *kkphone
          - *kknas
          - *kkworker
          - *kkserv


  # ============================================================
  # SERVICE SECRETS
  # ============================================================

  - path_regex: secrets/services/authentik\.ya?ml$
    key_groups:
      - age:
          - *master
          - *kkworker

  - path_regex: secrets/services/db/[a-z]*\.ya?ml$
    key_groups:
      - age:
          - *master
          - *kknas

  - path_regex: secrets/services/forgejo\.ya?ml$
    key_groups:
      - age:
          - *master
          - *kkworker

  - path_regex: secrets/services/netbird\.ya?ml$
    key_groups:
      - age:
          - *master
          - *kkserv

  - path_regex: secrets/services/nextcloud\.ya?ml$
    key_groups:
      - age:
          - *master
          - *kknas

  - path_regex: secrets/services/nfs\.ya?ml&
    key_groups:
      - age:
          - *master
          - *kknas
