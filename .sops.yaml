# sops configuration for the secrets tree.
#
# Every file under secrets/ is encrypted with the admin age recipient below.
# Run sops from the repository root so that the path_regex matches:
#   sops -e -i secrets/users/peon.yml
keys:
  - &admin age1dmawdc96sk8yent9u9wvmwzxk6ean4zpkq6n7msx952ppnnxj90q5utu5u

creation_rules:
  - path_regex: ^secrets/.*\.ya?ml$
    key_groups:
      - age:
          - *admin
